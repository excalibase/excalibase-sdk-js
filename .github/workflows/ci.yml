name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  # The SDK against a real excalibase-auth rather than mocked replies (EXC-607).
  real-auth:
    runs-on: ubuntu-latest
    env:
      SDK_REAL_AUTH_IMAGE: docker.io/excalibase/excalibase-auth:main-49f792b@sha256:76e0e2e3e2e3c06e44286097c7ece815a6261ada7d4074a83f0d25281347df0f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker pull -q "$SDK_REAL_AUTH_IMAGE"
      - run: npx jest test/real-auth.test.ts
      - name: Remove the test's containers, even after a cancelled run
        if: always()
        run: docker rm -f $(docker ps -aq --filter label=sdk-real-auth) 2>/dev/null || true
