name: Storefront example

# The storefront example (examples/storefront) has its own package: its unit
# tests, type check, build and container image are checked here, apart from the
# SDK's own CI.
on:
  push:
    branches: [main]
    paths: ["examples/storefront/**", ".github/workflows/storefront-example.yml"]
  pull_request:
    branches: [main]
    paths: ["examples/storefront/**", ".github/workflows/storefront-example.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/storefront
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/storefront/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Container image builds
        run: docker build -t storefront-demo:ci .
