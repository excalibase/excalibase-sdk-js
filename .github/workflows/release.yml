name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # changesets: push the version bump + tags
  pull-requests: write # changesets: open the "Version Packages" PR
  id-token: write # OIDC — Trusted Publishing + automatic provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Trusted Publishing needs Node >= 22.14
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1 (newer than what Node bundles).
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      # No NPM_TOKEN — `npm publish` (via `changeset publish`) authenticates over
      # OIDC because id-token:write is set and this repo is a configured trusted
      # publisher on npm. Provenance is generated automatically.
      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
