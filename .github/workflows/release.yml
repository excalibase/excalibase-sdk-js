name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # changesets: push the version bump + tags
  pull-requests: write # changesets: open the "Version Packages" PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      # changesets/action reads the env var literally named NPM_TOKEN to decide
      # token auth vs OIDC. It MUST be NPM_TOKEN (not NODE_AUTH_TOKEN) or the
      # action falls back to trusted publishing, which isn't configured.
      # No pending changesets -> publishes versions not yet on npm (0.9.0 first).
      # Pending changesets -> opens/updates the "Version Packages" PR instead.
      # TODO: switch to OIDC Trusted Publishing (drop NPM_TOKEN) later.
      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
